name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Real-process and installation regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python entrypoints
        run: python3 -m py_compile scripts/install.py src/async-task-watcher/scripts/supervisor.py
